 final step.</text><path d="M210 312 L380 372 V562 C380 682 300 752 210 812 C120 752 40 682 40 562 V372 Z" fill="url(#g3B1D0A1E1038v)" stroke="url(#gFBBF24F472B6v)" stroke-width="4" filter="url(#glow)"/><path d="M210 312 L380 372 V562 C380 682 300 752 210 812 C120 752 40 682 40 562 V372 Z" fill="none" stroke="#FBBF24" stroke-width="2"><animate attributeName="stroke-width" values="2;18" dur="2.6s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".6;0" dur="2.6s" repeatCount="indefinite"/></path><path d="M150 512 L198 562 L278 462" fill="none" stroke="#FDE68A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/><text x="210" y="862" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace" font-size="14" font-weight="700" fill="#FBBF24" text-anchor="middle" letter-spacing="5" >NO STATIC KEYS</text><line x1="478" y1="282" x2="478" y2="762" stroke="#7C8CFF" stroke-opacity=".3" stroke-dasharray="4 6"/><rect x="440" y="252" width="520" height="64" rx="16" fill="#FBBF24" fill-opacity=".09" stroke="#FBBF24" stroke-opacity=".45"/><circle cx="478" cy="284" r="15" fill="#0A0F2A" stroke="#FBBF24" stroke-width="2"/><text x="478" y="290" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace" font-size="15" font-weight="700" fill="#FBBF24" text-anchor="middle" letter-spacing="0" >1</text><text x="512" y="280" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="1" >OIDC</text><text x="512" y="302" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#B8C0E8" text-anchor="start" letter-spacing="0" >GitHub Actions federates into AWS, no stored keys</text><rect x="440" y="332" width="520" height="64" rx="16" fill="#FB923C" fill-opacity=".09" stroke="#FB923C" stroke-opacity=".45"/><circle cx="478" cy="364" r="15" fill="#0A0F2A" stroke="#FB923C" stroke-width="2"/><text x="478" y="370" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace" font-size="15" font-weight="700" fill="#FB923C" text-anchor="middle" letter-spacing="0" >2</text><text x="512" y="360" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="1" >TEMPORARY CREDENTIALS</text><text x="512" y="382" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#B8C0E8" text-anchor="start" letter-spacing="0" >short-lived, scoped to one repo and branch</text><rect x="440" y="412" width="520" height="64" rx="16" fill="#F87171" fill-opacity=".09" stroke="#F87171" stroke-opacity=".45"/><circle cx="478" cy="444" r="15" fill="#0A0F2A" stroke="#F87171" stroke-width="2"/><text x="478" y="450" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace" font-size="15" font-weight="700" fill="#F87171" text-anchor="middle" letter-spacing="0" >3</text><text x="512" y="440" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="1" >IRSA</text><text x="512" y="462" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#B8C0E8" text-anchor="start" letter-spacing="0" >pod-level roles, one service account each</text><rect x="440" y="492" width="520" height="64" rx="16" fill="#F472B6" fill-opacity=".09" stroke="#F472B6" stroke-opacity=".45"/><circle cx="478" cy="524" r="15" fill="#0A0F2A" stroke="#F472B6" stroke-width="2"/><text x="478" y="530" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace" font-size="15" font-weight="700" fill="#F472B6" text-anchor="middle" letter-spacing="0" >4</text><text x="512" y="520" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="1" >LEAST PRIVILEGE</text><text x="512" y="542" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#B8C0E8" text-anchor="start" letter-spacing="0" >scoped IAM policies, including Bedrock access</text><rect x="440" y="572" width="520" height="64" rx="16" fill="#E879F9" fill-opacity=".09" stroke="#E879F9" stroke-opacity=".45"/><circle cx="478" cy="604" r="15" fill="#0A0F2A" stroke="#E879F9" stroke-width="2"/><text x="478" y="610" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace" font-size="15" font-weight="700" fill="#E879F9" text-anchor="middle" letter-spacing="0" >5</text><text x="512" y="600" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="1" >PRIVATE NETWORK</text><text x="512" y="622" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#B8C0E8" text-anchor="start" letter-spacing="0" >private subnets, private RDS, restricted SGs</text><rect x="440" y="652" width="520" height="64" rx="16" fill="#A78BFA" fill-opacity=".09" stroke="#A78BFA" stroke-opacity=".45"/><circle cx="478" cy="684" r="15" fill="#0A0F2A" stroke="#A78BFA" stroke-width="2"/><text x="478" y="690" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace" font-size="15" font-weight="700" fill="#A78BFA" text-anchor="middle" letter-spacing="0" >6</text><text x="512" y="680" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="1" >WAF</text><text x="512" y="702" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#B8C0E8" text-anchor="start" letter-spacing="0" >AWS WAF and Cloudflare WAF, HTTPS enforced</text><rect x="440" y="732" width="520" height="64" rx="16" fill="#818CF8" fill-opacity=".09" stroke="#818CF8" stroke-opacity=".45"/><circle cx="478" cy="764" r="15" fill="#0A0F2A" stroke="#818CF8" stroke-width="2"/><text x="478" y="770" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace" font-size="15" font-weight="700" fill="#818CF8" text-anchor="middle" letter-spacing="0" >7</text><text x="512" y="760" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="1" >CLOUDTRAIL</text><text x="512" y="782" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#B8C0E8" text-anchor="start" letter-spacing="0" >audit logging and change tracking</text><g><circle r="14" fill="#FDE68A" opacity=".5" filter="url(#soft)"/><circle r="5" fill="#fff" filter="url(#glow)"/><animateMotion dur="7s" repeatCount="indefinite" path="M478 284 L478 764" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/></g><rect x=".75" y=".75" width="998.5" height="900.5" rx="27.5" fill="none" stroke="url(#gBorder)" stroke-width="1.5"/></svg>