<linearGradient id="gQuote" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#EEF2FF"/><stop offset="1" stop-color="#C4B5FD"/></linearGradient><linearGradient id="g818CF822D3EEh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#818CF8"/><stop offset="1" stop-color="#22D3EE"/></linearGradient><linearGradient id="g60A5FAA78BFAh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#A78BFA"/></linearGradient><linearGradient id="gA78BFAF0ABFCh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#F0ABFC"/></linearGradient><linearGradient id="gFBBF24F87171h" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F87171"/></linearGradient><linearGradient id="g22D3EE60A5FAh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#60A5FA"/></linearGradient><linearGradient id="g34D39922D3EEh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs><clipPath id="cl"><rect width="1000" height="992" rx="28"/></clipPath><g clip-path="url(#cl)"><rect width="1000" height="992" fill="url(#gBg)"/><circle cx="60" cy="40" r="240" fill="#4F46E5" opacity=".30" filter="url(#blur)"/><circle cx="960" cy="496" r="260" fill="#7C3AED" opacity=".22" filter="url(#blur)"/><circle cx="400" cy="962" r="240" fill="#0891B2" opacity=".16" filter="url(#blur)"/><rect width="1000" height="992" fill="url(#grid)"/></g><text x="960" y="200" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="230" font-weight="900" fill="none" text-anchor="end" letter-spacing="0" stroke="#818CF8" stroke-opacity=".22" stroke-width="1.5">02</text><text x="50" y="72" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace" font-size="15" font-weight="700" fill="#818CF8" text-anchor="start" letter-spacing="6" >— ENGINEERING PHILOSOPHY</text><text x="50" y="144" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="66" font-weight="800" fill="url(#g818CF822D3EEh)" text-anchor="start" letter-spacing="-1">HOW I THINK</text><text x="50" y="182" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#8E9AD0" text-anchor="start" letter-spacing="0" >Five habits that shape every system I touch.</text><text x="50" y="352" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="150" font-weight="900" fill="none" text-anchor="start" letter-spacing="0" stroke="#60A5FA" stroke-opacity=".55" stroke-width="2">01</text><text x="270" y="310" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="78" font-weight="800" fill="url(#g60A5FAA78BFAh)" text-anchor="start" letter-spacing="-1">ARCHITECT</text><text x="270" y="344" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#B8C0E8" text-anchor="start" letter-spacing="0" >Multi-AZ by default. Private subnets, load balancers,</text><text x="270" y="371" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#B8C0E8" text-anchor="start" letter-spacing="0" >and no single point of failure.</text><text x="950" y="502" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="150" font-weight="900" fill="none" text-anchor="end" letter-spacing="0" stroke="#A78BFA" stroke-opacity=".55" stroke-width="2">02</text><text x="730" y="460" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="78" font-weight="800" fill="url(#gA78BFAF0ABFCh)" text-anchor="end" letter-spacing="-1">AUTOMATE</text><text x="730" y="494" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#B8C0E8" text-anchor="end" letter-spacing="0" >Terraform, Ansible and pipelines. If it happens twice,</text><text x="730" y="521" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#B8C0E8" text-anchor="end" letter-spacing="0" >it becomes code.</text><text x="50" y="652" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="150" font-weight="900" fill="none" text-anchor="start" letter-spacing="0" stroke="#FBBF24" stroke-opacity=".55" stroke-width="2">03</text><text x="270" y="610" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="78" font-weight="800" fill="url(#gFBBF24F87171h)" text-anchor="start" letter-spacing="-1">SECURE</text><text x="270" y="644" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#B8C0E8" text-anchor="start" letter-spacing="0" >Federated identity, least-privilege roles, and nothing</text><text x="270" y="671" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#B8C0E8" text-anchor="start" letter-spacing="0" >long-lived left to leak.</text><text x="950" y="802" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="150" font-weight="900" fill="none" text-anchor="end" letter-spacing="0" stroke="#22D3EE" stroke-opacity=".55" stroke-width="2">04</text><text x="730" y="760" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="78" font-weight="800" fill="url(#g22D3EE60A5FAh)" text-anchor="end" letter-spacing="-1">OBSERVE</text><text x="730" y="794" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#B8C0E8" text-anchor="end" letter-spacing="0" >Metrics, logs and audit trails in place before the first</text><text x="730" y="821" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#B8C0E8" text-anchor="end" letter-spacing="0" >incident arrives.</text><text x="50" y="952" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="150" font-weight="900" fill="none" text-anchor="start" letter-spacing="0" stroke="#34D399" stroke-opacity=".55" stroke-width="2">05</text><text x="270" y="910" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="78" font-weight="800" fill="url(#g34D39922D3EEh)" text-anchor="start" letter-spacing="-1">SCALE</text><text x="270" y="944" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#B8C0E8" text-anchor="start" letter-spacing="0" >Autoscaling, replicas and edge caching: capacity that is</text><text x="270" y="971" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#B8C0E8" text-anchor="start" letter-spacing="0" >designed, not hoped for.</text><rect x=".75" y=".75" width="998.5" height="990.5" rx="27.5" fill="none" stroke="url(#gBorder)" stroke-width="1.5"/></svg>