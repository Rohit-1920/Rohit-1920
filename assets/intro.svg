<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" width="1000" height="510" role="img" aria-label="Introduction" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Introduction</title><defs><filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="45"/></filter>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="10"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7C8CFF" stroke-opacity=".08"/></pattern>
<linearGradient id="gBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05060C"/><stop offset=".55" stop-color="#0A1030"/><stop offset="1" stop-color="#150C35"/></linearGradient>
<linearGradient id="gBorder" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4F6BFF" stop-opacity=".75"/><stop offset=".5" stop-color="#7C3AED" stop-opacity=".25"/><stop offset="1" stop-color="#22D3EE" stop-opacity=".6"/></linearGradient>
<linearGradient id="gText" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#C7D2FE"/><stop offset="1" stop-color="#7DD3FC"/></linearGradient>
<linearGradient id="gQuote" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#EEF2FF"/><stop offset="1" stop-color="#C4B5FD"/></linearGradient><linearGradient id="g60A5FAA78BFAv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#A78BFA"/></linearGradient></defs><clipPath id="cl"><rect width="1000" height="510" rx="28"/></clipPath><g clip-path="url(#cl)"><rect width="1000" height="510" fill="url(#gBg)"/><circle cx="60" cy="40" r="240" fill="#2F5BFF" opacity=".30" filter="url(#blur)"/><circle cx="960" cy="255" r="260" fill="#7C3AED" opacity=".22" filter="url(#blur)"/><circle cx="400" cy="480" r="240" fill="#06B6D4" opacity=".16" filter="url(#blur)"/><rect width="1000" height="510" fill="url(#grid)"/></g><text x="50" y="70" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace" font-size="15" font-weight="700" fill="#7AA2FF" text-anchor="start" letter-spacing="6" >— INTRODUCTION</text><rect x="50" y="108" width="4" height="288" rx="2" fill="url(#g60A5FAA78BFAv)"/><text x="86" y="150" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="800" letter-spacing="-1"><tspan fill="#FFFFFF">I build cloud platforms where</tspan></text><text x="86" y="208" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="800" letter-spacing="-1"><tspan fill="#FFFFFF">deployments are </tspan><tspan fill="#7DD3FC">repeatable,</tspan></text><text x="86" y="266" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="800" letter-spacing="-1"><tspan fill="#FFFFFF">credentials are </tspan><tspan fill="#C4B5FD">temporary,</tspan></text><text x="86" y="324" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="800" letter-spacing="-1"><tspan fill="#FFFFFF">failures are </tspan><tspan fill="#67E8F9">observable,</tspan></text><text x="86" y="382" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="800" letter-spacing="-1"><tspan fill="#FFFFFF">and scale is </tspan><tspan fill="#93C5FD">designed, not hoped for.</tspan></text><text x="86" y="462" font-family="Inter,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#8E9AD0" text-anchor="start" letter-spacing="0" >Most of what I know comes from the moment a diagram and reality disagree, and from fixing it.</text><rect x=".75" y=".75" width="998.5" height="508.5" rx="27.5" fill="none" stroke="url(#gBorder)" stroke-width="1.5"/></svg>